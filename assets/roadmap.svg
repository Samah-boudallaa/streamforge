<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">StreamForge roadmap</title>
  <desc id="d">Nine development phases from core foundations to release. Phase 1 is in progress; all others are planned. Phases 2 to 4 form the first milestone.</desc>
  <style>
    text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; text-anchor: middle; }
    .n  { font-size: 18px; font-weight: 800; }
    .t  { font-size: 14px; font-weight: 700; fill: #f0f6fc; }
    .d  { font-size: 12px; fill: #9da7b3; }
    .st { font-size: 12px; font-weight: 600; }
    .lg { font-size: 12px; fill: #9da7b3; text-anchor: start; }
  </style>

  <rect width="1200" height="400" rx="18" fill="#0d1117"/>

  <!-- First milestone bracket -->
  <path d="M217.5 110 V98 H472.5 V110" fill="none" stroke="#ff8a3d" stroke-width="2"/>
  <text x="345" y="84" font-size="13" font-weight="600" fill="#ffb347">First milestone: ingest, store, filter, aggregate</text>

  <!-- Timeline -->
  <line x1="90" y1="150" x2="1110" y2="150" stroke="#30363d" stroke-width="4" stroke-linecap="round"/>
  <line x1="90" y1="150" x2="150" y2="150" stroke="#58a6ff" stroke-width="4" stroke-linecap="round"/>

  <!-- Nodes -->
  <circle cx="90"   cy="150" r="24" fill="#58a6ff" stroke="#58a6ff" stroke-width="3"/><text x="90"   y="156" class="n" fill="#0d1117">1</text>
  <circle cx="217.5" cy="150" r="24" fill="#0d1117" stroke="#ff8a3d" stroke-width="3"/><text x="217.5" y="156" class="n" fill="#ff8a3d">2</text>
  <circle cx="345"  cy="150" r="24" fill="#0d1117" stroke="#ff8a3d" stroke-width="3"/><text x="345"  y="156" class="n" fill="#ff8a3d">3</text>
  <circle cx="472.5" cy="150" r="24" fill="#0d1117" stroke="#ff8a3d" stroke-width="3"/><text x="472.5" y="156" class="n" fill="#ff8a3d">4</text>
  <circle cx="600"  cy="150" r="24" fill="#0d1117" stroke="#a371f7" stroke-width="3"/><text x="600"  y="156" class="n" fill="#a371f7">5</text>
  <circle cx="727.5" cy="150" r="24" fill="#0d1117" stroke="#a371f7" stroke-width="3"/><text x="727.5" y="156" class="n" fill="#a371f7">6</text>
  <circle cx="855"  cy="150" r="24" fill="#0d1117" stroke="#a371f7" stroke-width="3"/><text x="855"  y="156" class="n" fill="#a371f7">7</text>
  <circle cx="982.5" cy="150" r="24" fill="#0d1117" stroke="#3fb9a0" stroke-width="3"/><text x="982.5" y="156" class="n" fill="#3fb9a0">8</text>
  <circle cx="1110" cy="150" r="24" fill="#0d1117" stroke="#3fb9a0" stroke-width="3"/><text x="1110" y="156" class="n" fill="#3fb9a0">9</text>

  <!-- Titles -->
  <g class="t">
    <text x="90"    y="208">Core</text><text x="90"    y="226">Foundations</text>
    <text x="217.5" y="208">Data</text><text x="217.5" y="226">Ingestion</text>
    <text x="345"   y="208">Columnar</text><text x="345"   y="226">Storage</text>
    <text x="472.5" y="208">Query</text><text x="472.5" y="226">Execution</text>
    <text x="600"   y="208">Query</text><text x="600"   y="226">Optimizer</text>
    <text x="727.5" y="208">Memory</text><text x="727.5" y="226">Management</text>
    <text x="855"   y="208">Parallel</text><text x="855"   y="226">Execution</text>
    <text x="982.5" y="208">Benchmarks</text><text x="982.5" y="226">and Profiling</text>
    <text x="1110"  y="208">Integration</text><text x="1110"  y="226">and Release</text>
  </g>

  <!-- Descriptions -->
  <g class="d">
    <text x="90" y="256">CMake, tests,</text><text x="90" y="272">error handling,</text><text x="90" y="288">conventions</text>
    <text x="217.5" y="256">CSV and JSONL,</text><text x="217.5" y="272">schemas,</text><text x="217.5" y="288">validation</text>
    <text x="345" y="256">Columns, buffers,</text><text x="345" y="272">batches,</text><text x="345" y="288">null bitmaps</text>
    <text x="472.5" y="256">Scan, filter,</text><text x="472.5" y="272">aggregate, sort,</text><text x="472.5" y="288">hash join</text>
    <text x="600" y="256">Logical and</text><text x="600" y="272">physical plans,</text><text x="600" y="288">pushdowns</text>
    <text x="727.5" y="256">Accounting,</text><text x="727.5" y="272">limits,</text><text x="727.5" y="288">disk spilling</text>
    <text x="855" y="256">Thread pool,</text><text x="855" y="272">scheduling,</text><text x="855" y="288">parallel operators</text>
    <text x="982.5" y="256">Reproducible</text><text x="982.5" y="272">workloads,</text><text x="982.5" y="288">profiling</text>
    <text x="1110" y="256">CLI, docs, CI,</text><text x="1110" y="272">examples,</text><text x="1110" y="288">release</text>
  </g>

  <!-- Status pills -->
  <rect x="47" y="308" width="86" height="24" rx="12" fill="#58a6ff"/>
  <text x="90" y="325" class="st" fill="#0d1117">Done</text>
  <g fill="none" stroke="#30363d">
    <rect x="174.5" y="308" width="86" height="24" rx="12" stroke="#ff8a3d"/>
    <rect x="302"   y="308" width="86" height="24" rx="12" stroke="#ff8a3d"/>
    <rect x="429.5" y="308" width="86" height="24" rx="12"/>
    <rect x="557"   y="308" width="86" height="24" rx="12"/>
    <rect x="684.5" y="308" width="86" height="24" rx="12"/>
    <rect x="812"   y="308" width="86" height="24" rx="12"/>
    <rect x="939.5" y="308" width="86" height="24" rx="12"/>
    <rect x="1067"  y="308" width="86" height="24" rx="12"/>
  </g>
  <g class="st" fill="#8b949e">
    <text x="217.5" y="325" fill="#ff8a3d">In progress</text>
    <text x="345" y="325" fill="#ff8a3d">In progress</text>
    <text x="472.5" y="325">Planned</text>
    <text x="600"   y="325">Planned</text>
    <text x="727.5" y="325">Planned</text>
    <text x="855"   y="325">Planned</text>
    <text x="982.5" y="325">Planned</text>
    <text x="1110"  y="325">Planned</text>
  </g>

  <!-- Legend -->
  <circle cx="300" cy="372" r="5" fill="#58a6ff"/><text x="312" y="376" class="lg">Foundations</text>
  <circle cx="430" cy="372" r="5" fill="#ff8a3d"/><text x="442" y="376" class="lg">Core engine</text>
  <circle cx="560" cy="372" r="5" fill="#a371f7"/><text x="572" y="376" class="lg">Efficiency and scale</text>
  <circle cx="740" cy="372" r="5" fill="#3fb9a0"/><text x="752" y="376" class="lg">Quality and release</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
