<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Query optimization with pushdown</title>
  <desc id="d">A naive plan scans all columns and all rows before filtering. The optimized plan pushes the projection and the predicate into the scan so far less data flows through the pipeline.</desc>
  <style>
    text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
    .sec { font-size: 13px; font-weight: 700; letter-spacing: 3px; }
    .bt  { font-size: 16px; font-weight: 700; fill: #f0f6fc; }
    .bs  { font-size: 13px; fill: #9da7b3; }
    .lab { font-size: 13px; text-anchor: middle; font-weight: 600; }
    .ct  { font-size: 15px; font-weight: 700; fill: #f0f6fc; }
    .cd  { font-size: 13px; fill: #9da7b3; }
    .card { fill: #161b22; stroke: #30363d; stroke-width: 1.2; }
  </style>

  <rect width="1200" height="570" rx="18" fill="#0d1117"/>

  <rect x="260" y="18" width="680" height="42" rx="21" fill="#1c2330" stroke="#a371f7"/>
  <text x="600" y="44" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="15" fill="#d2b8ff" text-anchor="middle">SELECT region, SUM(amount) FROM sales WHERE year = 2025 GROUP BY region;</text>

  <!-- NAIVE -->
  <text x="40" y="96" class="sec" fill="#ff7b72">NAIVE PLAN</text>

  <rect x="40" y="110" width="240" height="80" rx="12" class="card"/>
  <text x="60" y="142" class="bt">Scan</text>
  <text x="60" y="166" class="bs">reads every column, every row</text>

  <rect x="420" y="110" width="240" height="80" rx="12" class="card"/>
  <text x="440" y="142" class="bt">Filter</text>
  <text x="440" y="166" class="bs">WHERE year = 2025</text>

  <rect x="800" y="110" width="240" height="80" rx="12" class="card"/>
  <text x="820" y="142" class="bt">Aggregate</text>
  <text x="820" y="166" class="bs">SUM(amount) BY region</text>

  <path d="M284 132 H392 V120 L416 150 L392 180 V168 H284 Z" fill="#f85149" fill-opacity=".75"/>
  <path d="M664 145 H776 V139 L796 150 L776 161 V155 H664 Z" fill="#3fb9a0"/>
  <text x="350" y="212" class="lab" fill="#ff7b72">all rows, all columns</text>
  <text x="730" y="212" class="lab" fill="#3fb9a0">matching rows only</text>

  <line x1="40" y1="246" x2="1160" y2="246" stroke="#30363d" stroke-dasharray="4 4"/>

  <!-- OPTIMIZED -->
  <text x="40" y="282" class="sec" fill="#3fb9a0">OPTIMIZED PLAN</text>

  <rect x="40" y="296" width="400" height="80" rx="12" class="card" stroke="#3fb9a0"/>
  <text x="60" y="328" class="bt">Scan with pushdown</text>
  <text x="60" y="352" class="bs">only needed columns, year = 2025 applied in the scan</text>

  <rect x="640" y="296" width="240" height="80" rx="12" class="card"/>
  <text x="660" y="328" class="bt">Aggregate</text>
  <text x="660" y="352" class="bs">SUM(amount) BY region</text>

  <path d="M444 331 H612 V325 L636 336 L612 347 V341 H444 Z" fill="#3fb9a0"/>
  <text x="540" y="398" class="lab" fill="#3fb9a0">only the data the query needs</text>

  <!-- Callouts -->
  <rect x="40" y="424" width="350" height="100" rx="12" class="card"/>
  <rect x="40" y="424" width="6" height="100" rx="3" fill="#58a6ff"/>
  <text x="66" y="456" class="ct">Projection pushdown</text>
  <text x="66" y="482" class="cd">Read only the columns the query</text>
  <text x="66" y="502" class="cd">actually uses.</text>

  <rect x="425" y="424" width="350" height="100" rx="12" class="card"/>
  <rect x="425" y="424" width="6" height="100" rx="3" fill="#a371f7"/>
  <text x="451" y="456" class="ct">Predicate pushdown</text>
  <text x="451" y="482" class="cd">Apply filters as early as possible,</text>
  <text x="451" y="502" class="cd">so less data flows downstream.</text>

  <rect x="810" y="424" width="350" height="100" rx="12" class="card"/>
  <rect x="810" y="424" width="6" height="100" rx="3" fill="#ff8a3d"/>
  <text x="836" y="456" class="ct">Why it matters</text>
  <text x="836" y="482" class="cd">Less data moved means fewer CPU</text>
  <text x="836" y="502" class="cd">cycles and a smaller memory footprint.</text>

  <text x="600" y="552" font-size="12" fill="#6e7681" text-anchor="middle">Illustrative diagram of the planned optimizer. No measured results yet.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
