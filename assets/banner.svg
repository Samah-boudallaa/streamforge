<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">StreamForge</title>
  <desc id="d">StreamForge: an analytical data engine, forged from scratch in C17.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1a1f2b"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b2c"/>
      <stop offset="1" stop-color="#ffc857"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff6b2c" stop-opacity=".12"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#ff6b2c" stop-opacity=".30"/>
      <stop offset="1" stop-color="#ff6b2c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".04"/>
    </pattern>
  </defs>

  <rect width="1280" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="18" fill="url(#grid)"/>
  <rect width="1280" height="340" rx="18" fill="url(#glow)"/>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="92" font-size="15" font-weight="600" letter-spacing="4" fill="#ff8a3d">ANALYTICAL DATA ENGINE  /  C17</text>
    <text x="78" y="178" font-size="88" font-weight="800" fill="url(#fire)">StreamForge</text>
    <text x="80" y="222" font-size="24" fill="#c9d1d9">Forged from scratch: columns, batches, threads, and honest measurements.</text>

    <g font-size="15" fill="#e6edf3" text-anchor="middle">
